syntax = "proto3";

package yadgar.task.v1;

import "google/protobuf/field_mask.proto";
import "yadgar/common/v1/common.proto";

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_OPEN = 1;
  TASK_STATUS_IN_PROGRESS = 2;
  TASK_STATUS_BLOCKED = 3;
  TASK_STATUS_DONE = 4;
  TASK_STATUS_DROPPED = 5;
}

message Task {
  yadgar.common.v1.Meta meta = 1;

  // Semantic reference, same rationale as Adr.number.
  uint32 number = 16;

  // A short, stable summary: AT MOST 128 UNICODE SCALAR VALUES (code points),
  // counted on the string exactly as sent, with no trimming or normalisation.
  //
  // THE UNIT IS THE CODE POINT, NOT THE BYTE. It is what every layer that
  // measures a title already counts: Rust `str::chars().count()`, MariaDB
  // `CHAR_LENGTH` over a utf8mb4 column, and JSON Schema `maxLength`. A byte
  // cap would give a Persian or CJK title a half or a third of the room an
  // English one gets, for no storage reason: the column is utf8mb4
  // `VARCHAR(512)`, which holds 512 characters, not 512 bytes.
  //
  // THE BOUND IS THE CONTRACT; ENFORCEMENT FOLLOWS IT. Once the titles already
  // stored are shortened, `yadgar.taskapi.v1.TaskService` refuses a longer
  // title with INVALID_ARGUMENT on CreateTask and on an EditTask whose mask
  // writes `title`, and task-db refuses one with a CHECK constraint. Until both
  // ship, a stored title CAN be longer, and a reader must not assume it is at
  // most 128. A READ is never refused for a title's length.
  string title = 17;
  string body = 18;
  TaskStatus status = 19;
  repeated string tags = 20;

  // URNs — an ADR, a wiki page, a parent task.
  repeated string links = 21;
}

message CreateTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  Task task = 3;
}
message CreateTaskResponse {
  yadgar.common.v1.Meta meta = 1;
  uint32 number = 2;
}

message UpdateTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
  Task task = 5;
  google.protobuf.FieldMask update_mask = 6;

  // THE CALLER FINGERPRINT (ADR-1051): what the logic service sent this write
  // in answer to, as 32 raw SHA-256 bytes. Its derivation is stated once, on
  // LookupWriteRequest.caller_fingerprint, and these bytes must equal the ones
  // the same call sent to LookupWrite.
  //
  // EMPTY MEANS ABSENT, which is what every caller that predates this field
  // sends. Present, it must be exactly 32 bytes, or the write is refused with
  // INVALID_ARGUMENT.
  //
  // THE CLAIM STORES IT, beside the claim's own request fingerprint, so a
  // later LookupWrite can compare against it.
  //
  // IT DECIDES A CLAIM COLLISION WHEN IT CAN. When this key is already
  // claimed and BOTH the stored claim and this request carry a caller
  // fingerprint, that comparison decides: equal replays the recorded outcome,
  // different is refused with INVALID_ARGUMENT. Otherwise the store's own
  // request fingerprint decides, as before this field existed. This also
  // decides a LookupWrite miss that collides at the claim, because another
  // attempt claimed the key in between (ADR-1051 rule 8).
  //
  // THE STORE'S REQUEST FINGERPRINT EXCLUDES THIS FIELD, as it excludes
  // `scope` and `idempotency`. Otherwise an old caller and a new one sending
  // the same write would differ by this field alone.
  bytes caller_fingerprint = 7;
}
message UpdateTaskResponse {
  yadgar.common.v1.Meta meta = 1;

  // The status the row held BEFORE this update was applied, RECORDED AT THE
  // TIME OF THE WRITE and returned unchanged on every replay of the same
  // idempotency key (D9).
  //
  // WHY THE STORE HAS TO CARRY IT. yadgar.taskapi.v1.TransitionTaskResponse.from
  // reports what a task moved FROM, so that a caller who raced another writer
  // sees what actually happened rather than assuming its own read was current.
  // On a replayed transition nothing else in the system still holds that value:
  // the logic service reads the task first and gets the status the FIRST attempt
  // already wrote, an identity transition passes the rules unchanged, and D4
  // forbids the logic service a store of its own to remember it in. The
  // idempotency row is the only thing that survives the first attempt, so the
  // prior status must be recorded there rather than recomputed. RETURNING THE
  // ROW'S CURRENT STATUS ON A REPLAY IS THE DEFECT THIS FIELD EXISTS TO CLOSE,
  // and it is the exact assumption `from` was added to break.
  //
  // RECORDED ON EVERY UPDATE, not only on a status change. An `update_mask`
  // that does not touch `status` still leaves a status the row held beforehand,
  // and this field carries it — equal to the status the row holds afterwards,
  // which is the truth rather than an omission. The one thing that makes the
  // field absent is a store that has not implemented it.
  //
  // TASK_STATUS_UNSPECIFIED IS THE NEGATIVE ANSWER, AND IT ARRIVES AS `Ok`. It
  // means the prior status was not recorded, and after this field ships that is
  // one condition only: an idempotency row written before it existed. It is NOT
  // a transition out of "unspecified", and a consumer must not report it as one
  // — carry it through, or say the prior status is unknown. It must never be
  // replaced with a guess, and a read of the task is the wrong guess, because
  // that read is what returns the post-transition status in the first place.
  // Stated here because a zero-valued enum needs no handling to compile and
  // reads as an ordinary status to anyone not told otherwise (ADR-0512).
  TaskStatus previous_status = 2;
}

message GetTaskRequest {
  yadgar.common.v1.Scope scope = 1;
  oneof key {
    string id = 2;
    uint32 number = 3;
  }
}
message GetTaskResponse {
  Task task = 1;
}

message ListTasksRequest {
  yadgar.common.v1.Scope scope = 1;
  repeated TaskStatus statuses = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message ListTasksResponse {
  repeated Task tasks = 1;
  string next_page_token = 2;
}

message DeleteTaskRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;

  // THE CALLER FINGERPRINT (ADR-1051), with exactly the rules on
  // UpdateTaskRequest.caller_fingerprint: empty means absent, any length other
  // than 32 is INVALID_ARGUMENT, the claim stores it, it decides a claim
  // collision when both sides carry one, and the store's request fingerprint
  // excludes it.
  bytes caller_fingerprint = 5;
}
message DeleteTaskResponse {}

// The write RPC a claim was recorded for. Each value names the TaskDbService
// RPC, not the logic-service RPC that called it: EditTask and TransitionTask
// both write through UpdateTask, so both look up WRITE_RPC_UPDATE_TASK. What
// tells those two apart under one key is the caller fingerprint, whose input
// starts with the logic-service RPC name; a claim that stores no caller
// fingerprint cannot tell them apart and replays (see LookupWrite).
enum WriteRpc {
  // Refused with INVALID_ARGUMENT.
  WRITE_RPC_UNSPECIFIED = 0;
  WRITE_RPC_CREATE_TASK = 1;
  WRITE_RPC_UPDATE_TASK = 2;
  WRITE_RPC_DELETE_TASK = 3;
}

// Look up a recorded write by its idempotency key, without writing (ADR-1051).
//
// WHY IT EXISTS. The logic service reads a task before it writes it. A
// same-key retry whose first attempt was applied can then fail that read
// (the task was removed or left the caller's reach), or fail a check made on
// what the read returned, before the store ever sees the key. This RPC lets
// the logic service ask the claim ledger first, so the retry is replayed
// (D9) rather than refused.
message LookupWriteRequest {
  // As on every TaskDbService RPC. A missing or empty scope is refused as the
  // other TaskDbService RPCs refuse it.
  yadgar.common.v1.Scope scope = 1;

  // THE KEY TO LOOK UP. AN EMPTY KEY IS REFUSED WITH INVALID_ARGUMENT. A write
  // with no key records no claim, so a lookup of one could only ever miss,
  // and a caller that sends one has a bug that a silent miss would hide.
  yadgar.common.v1.Idempotency idempotency = 2;

  // The write RPC the caller is about to make. WRITE_RPC_UNSPECIFIED is
  // refused with INVALID_ARGUMENT.
  WriteRpc rpc = 3;

  // THE CALLER FINGERPRINT: REQUIRED, EXACTLY 32 BYTES. Empty, or any other
  // length, is refused with INVALID_ARGUMENT. The same bytes travel on the
  // write that follows a miss (UpdateTaskRequest.caller_fingerprint,
  // DeleteTaskRequest.caller_fingerprint).
  //
  // THE DERIVATION (ADR-1051 rule 5). The logic service computes SHA-256 over
  // the concatenation of:
  //   1. the fully-qualified gRPC method path of the yadgar.taskapi.v1
  //      TaskService RPC it is serving, as UTF-8 bytes — exactly
  //      "/yadgar.taskapi.v1.TaskService/EditTask",
  //      "/yadgar.taskapi.v1.TaskService/TransitionTask" or
  //      "/yadgar.taskapi.v1.TaskService/RemoveTask";
  //   2. one 0x00 byte;
  //   3. the prost encoding of the taskapi request message as decoded, with
  //      `scope` and `idempotency` set to absent, `update_mask` set to absent
  //      when its `paths` is empty, and otherwise its `paths` sorted and
  //      deduplicated.
  //
  // IT IS A RE-ENCODING OF THE DECODED MESSAGE, NOT THE BYTES ON THE WIRE.
  // Unknown fields are dropped and fields come out in field-number order. An
  // absent `update_mask` and a present one with no paths mean the same edit,
  // so the derivation makes them equal; no other equivalence between masks is
  // folded.
  //
  // WHEN IT IS COMPUTED. After the logic service's request-only checks, and
  // before any read of the task or any patch computation, so it is the same
  // on every attempt whatever happened to the task in between.
  //
  // THE BYTES ARE A COMPATIBILITY SURFACE. Known-answer tests in the logic
  // service pin them. A change to any part of the derivation needs a task-db
  // migration that sets every stored caller fingerprint to NULL; otherwise
  // every retry across the deploy is refused as a different request. A
  // taskapi field that task learns in a later release enters the encoding for
  // any caller that already sends it, so such a caller's retry across that
  // deploy is refused as a different request; it is one, because task now
  // acts on the field.
  bytes caller_fingerprint = 4;
}

// The recorded outcome, or nothing.
//
// AN UNSET `outcome` IS A MISS, AND IT ARRIVES AS OK, never as an error
// status: the common path is a key never used, and it must stay out of error
// telemetry. A miss reveals only that this caller never claimed this key in
// this project.
//
// A HIT RETURNS THE OUTCOME EXACTLY AS RECORDED: the response the first
// attempt returned, decoded from the claim and not recomputed from the task
// row. A hit is set in the arm that matches the request's `rpc`.
message LookupWriteResponse {
  oneof outcome {
    CreateTaskResponse create = 1;
    UpdateTaskResponse update = 2;
    DeleteTaskResponse delete = 3;
  }
}

service TaskDbService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);

  // Look up a write's claim by its idempotency key (ADR-1051).
  //
  // A READ. It takes no lock and runs outside any transaction. task-db's
  // claim stays authoritative: a miss here followed by a collision at the
  // write's claim is decided there, by the rules on
  // UpdateTaskRequest.caller_fingerprint.
  //
  // THE CLAIM IS FOUND BY EQUALITY ON (project_id, user_id, idempotency key),
  // taken from `scope` and `idempotency`. The task's reach and
  // `scope.team_ids` take no part: the claim is the caller's own record, and
  // the task it names may since have been removed or moved out of reach.
  //
  // A HIT IS REFUSED WITH INVALID_ARGUMENT, with the texts a colliding write
  // claim already uses, when either:
  //   - the claim was recorded for another write RPC than `rpc`; or
  //   - the claim stores a caller fingerprint that differs from the request's.
  // A CLAIM RECORDED FOR THE SAME `rpc` THAT STORES NO CALLER FINGERPRINT
  // REPLAYS, without a fingerprint comparison. A claim stores none when its
  // write carried none: every claim recorded before task-db's migration 8,
  // every CreateTask claim (CreateTaskRequest has no such field), and every
  // UpdateTask or DeleteTask sent without one, for example by a task that
  // predates ADR-1051. The rpc check still runs on these: a lookup for
  // WRITE_RPC_UPDATE_TASK or WRITE_RPC_DELETE_TASK that hits a CreateTask
  // claim is refused as another write RPC.
  //
  // KEYS ARE KEPT INDEFINITELY; no purge exists. If one is ever added, a
  // purged key is a miss.
  rpc LookupWrite(LookupWriteRequest) returns (LookupWriteResponse);
}
