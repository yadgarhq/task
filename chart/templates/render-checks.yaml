{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. `autoscaling.enabled` renders one kind
today, so the two counts happen to be equal here — they are not the same rule, and
the number this chart asserts is the number of CHECKS.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count rather
than letting it quietly exercise one fewer.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the CALL
has to sit in a rendered template. Do not tidy the two into one file.

THE GROUP IS THE OPERATOR'S OWN. `keda.sh/v1alpha1` is registered by KEDA and by
nothing else, so there is no sibling specification a check could name by mistake —
unlike the Gateway API, which several implementations register. The string is a
LITERAL here because `scripts/tests/test_render_checks.py` reads these arguments off
the template to count and exercise the checks; it is RECORDED a second time in
`values.yaml` under `autoscaling.kedaOperator.apiVersion`, beside the toggle, and the
gate that keeps the two one is
`test_autoscaling.py::test_the_render_check_names_the_group_the_values_file_records`.

THIS CHART DECLARES NO GATEWAY API CHECK, and that absence is a decision rather than
an omission. A render check may only ever sit behind a default-false toggle, and
`gateway.enabled` is the one toggle in this estate that is true by default — a check
behind it would refuse every offline render in the estate. The rule is about the
toggle's DEFAULT, not about the API group.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all: `Has` is false for
every CRD-backed group with no cluster, so a check reachable at the defaults would
refuse every offline render.
*/}}
{{/*
THE SHAPE OF `autoscaling` AND `autoscaling.enabled`, REFUSED BEFORE THIS CHECK READS
THEM (ledger 1135).

`{{- if .Values.autoscaling.enabled }}` BELOW, AND `templates/scaledobject.yaml`'s
own gate, are BARE TRUTHINESS TESTS, which are FAIL-OPEN on a string. Measured on
helm 3.20.2 and 4.3.0, identically:

  false, 0, null, {}, []   render no ScaledObject
  true                     renders one
  "false", "no", "true", 1 render one

So `autoscaling.enabled: "false"` — which reads as OFF to any human, and is what a
`--set-string`, a templated overlay or a quoted values file produces — CREATES A
SCALEDOBJECT. ADR-0797 is the governing rule for this arm: a values key a helm
condition reads, and that this chart DECLARES, is validated with `kindIs "bool"` ON
THE RAW VALUE, `hasKey` first because `kindOf` cannot tell a deleted key from an
absent one.

ONE LEVEL UP, `autoscaling` ITSELF IS READ AS A BLOCK, NOT A TOGGLE, by both this
check and `templates/scaledobject.yaml`. Measured: a values file setting
`autoscaling: "x"` crashes `templates/scaledobject.yaml` with a raw Go template
error naming no key at all, because `.enabled` cannot be read off a non-map.
ADR-0794 is the governing rule for THIS arm: shape is tested with `kindIs "map"`
ON THE RAW VALUE, `hasKey` first, for the same reason.

ADR-0850 is why BOTH templates need their own copy of this: a `fail` here aborts the
whole render, but which template's unguarded read panics first is not under this
chart's control (measured: `scaledobject.yaml` panics before this file's `fail` is
ever reached), so `templates/scaledobject.yaml` carries its own `kindIs "map"` guard
rather than relying on this one running first.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794) — a refusal and
a raise both exit 1, so the message is the only thing that tells them apart.
`scripts/tests/test_render_checks.py` holds the banned markers in one place and
reads this whole file for them; the nine-shape table beside it is the gate on this
block.
*/}}
{{- if not (hasKey .Values "autoscaling") }}
{{- fail (join "" (list
      "task: `autoscaling` is absent from the values, so `autoscaling.enabled` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and restores no "
      "default, so a values file writing `autoscaling:` with no value leaves this chart with "
      "nothing under it. Write the keys you mean, or omit `autoscaling` entirely and this "
      "chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.autoscaling) }}
{{- fail (printf (join "" (list
      "task: `autoscaling` must be a map and is %s (%s). `autoscaling.enabled` is read from "
      "inside it, and a non-map here crashes the template with a raw Go error naming no key "
      "at all. Write `autoscaling:` as a block, with `enabled: true` or `enabled: false` "
      "inside it."))
      (kindOf .Values.autoscaling) (toJson .Values.autoscaling)) }}
{{- end }}
{{- if not (hasKey .Values.autoscaling "enabled") }}
{{- fail (join "" (list
      "task: `autoscaling.enabled` is absent. This chart's `values.yaml` declares it false, so "
      "it is missing only when a values file wrote `enabled:` with NO VALUE — helm deletes a "
      "null-valued key a chart declares and restores no default. Write `autoscaling.enabled: "
      "false` to leave autoscaling off, or `true` to turn it on.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.autoscaling.enabled) }}
{{- fail (printf (join "" (list
      "task: `autoscaling.enabled` must be true or false and is %s (%s). A string, number, map "
      "or list here is not a toggle: the template gates on bare truthiness, so \"false\", "
      "\"no\", \"true\" and 1 all CREATE a ScaledObject while {}, 0 and [] do not, and nothing "
      "tells you which one you wrote. Write the bare word `true` or `false`."))
      (kindOf .Values.autoscaling.enabled) (toJson .Values.autoscaling.enabled)) }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- include "task.require-api" (dict
      "context" $
      "apiVersion" "keda.sh/v1alpha1"
      "operator" "KEDA"
      "toggle" "autoscaling.enabled") }}
{{- end }}

{{/*
THE SHAPE OF `tls.enabled` AND `taskDb.tls.enabled`, REFUSED BEFORE
`templates/deployment.yaml` CAN RENDER THEM (ADR-0845, C-SVb).

`templates/deployment.yaml` now renders `LISTEN_TLS_ENABLED` and
`TASK_DB_TLS_ENABLED` UNCONDITIONALLY — ADR-0845 deleted the binary's
compiled-in default for both, so the chart can no longer skip either
variable when TLS is "off"; it must always say which one it means, as
`ternary "1" "0" .Values.tls.enabled` (and the same for `taskDb.tls.enabled`).
A BARE `.Values.tls.enabled` read is FAIL-OPEN on a string exactly as
`autoscaling.enabled` above: `tls.enabled: "false"` reads as off to any
human, and under Go template truthiness a non-empty string is truthy, so
`ternary` would hand the pod LISTEN_TLS_ENABLED="1" for a value every reader
believes turned TLS off. This is the same two-part guard every other toggle
here carries: `hasKey` before `kindIs`, because `kindOf` answers `invalid`
for a deleted key and for an absent one alike and cannot tell them apart.

`tls` AND `taskDb.tls` ARE GUARDED FIRST, the same `hasKey` then `kindIs "map"`
idiom as `autoscaling`: `certSecret`, `certSecretKey`, `keySecretKey` and the
`clientAuth`, `clientCaSecret` and `clientCaSecretKey` (B-U5) all live
under `tls`; `caSecret`, `caSecretKey`, `domain`, `clientCertSecret`,
`clientCertSecretKey` and `clientKeySecretKey` all live under `taskDb.tls`.

`templates/deployment.yaml` CARRIES ITS OWN `kindIs "map"` GUARD on the same
reads, the same defence `templates/scaledobject.yaml` carries for
`autoscaling.enabled` — the refusal below is reached only once that guard has
already kept the read safe, whichever of the two templates helm reaches first.

UNLIKE `autoscaling.enabled`, THIS GUARD HAS NO TRAILING
`include "task.require-api"`: TLS needs no CRD-backed operator at render
time, only a Secret, so there is no API-availability check to chain after the
shape is proved sound.
*/}}
{{- if not (hasKey .Values "tls") }}
{{- fail (join "" (list
      "task: `tls` is absent from the values, so `tls.enabled` cannot be read. "
      "Helm deletes a null-valued key that a chart in the tree declares, and "
      "restores no default, so a values file writing `tls:` with no value leaves "
      "this chart with nothing under it. Write the keys you mean: `tls.enabled` "
      "has no default (ADR-0845) and must be `true` or `false`.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.tls) }}
{{- fail (printf (join "" (list
      "task: `tls` must be a map and is %s (%s). `enabled`, `certSecret`, "
      "`certSecretKey` and `keySecretKey` all live under it, so a string, number "
      "or list here cannot be read. Write the block this chart's `values.yaml` "
      "declares."))
      (kindOf .Values.tls) (toJson .Values.tls)) }}
{{- end }}
{{- if not (hasKey .Values.tls "enabled") }}
{{- fail (join "" (list
      "task: `tls.enabled` is absent. ADR-0845 gives this knob no compiled-in "
      "default: an absent or nulled value is a choice this chart cannot make for "
      "an adopter. Write `tls.enabled: true` to serve this listener over TLS, or "
      "`false` to leave it in cleartext.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.tls.enabled) }}
{{- fail (printf (join "" (list
      "task: `tls.enabled` must be true or false and is %s (%s). A string, "
      "number, map or list here is not a toggle: the chart renders "
      "LISTEN_TLS_ENABLED from it unconditionally, so a quoted or typed value "
      "would be misread rather than refused until the pod either fails to boot "
      "or serves the wrong transport. Write the bare word `true` or `false`."))
      (kindOf .Values.tls.enabled) (toJson .Values.tls.enabled)) }}
{{- end }}
{{- if not (hasKey .Values "taskDb") }}
{{- fail (join "" (list
      "task: `taskDb` is absent from the values, so `taskDb.tls.enabled` cannot "
      "be read. Helm deletes a null-valued key that a chart in the tree "
      "declares, and restores no default, so a values file writing `taskDb:` "
      "with no value leaves this chart with nothing under it. Write the keys "
      "you mean: `taskDb.tls.enabled` has no default (ADR-0845) and must be "
      "`true` or `false`.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.taskDb) }}
{{- fail (printf (join "" (list
      "task: `taskDb` must be a map and is %s (%s). `host`, `port` and `tls` "
      "all live under it, so a string, number or list here cannot be read. "
      "Write the block this chart's `values.yaml` declares."))
      (kindOf .Values.taskDb) (toJson .Values.taskDb)) }}
{{- end }}
{{- if not (hasKey .Values.taskDb "tls") }}
{{- fail (join "" (list
      "task: `taskDb.tls` is absent from the values, so `taskDb.tls.enabled` "
      "cannot be read. Helm deletes a null-valued key that a chart in the tree "
      "declares, and restores no default, so a values file writing `taskDb: "
      "{tls:}` with no value leaves this chart with nothing under it. Write "
      "the keys you mean: `taskDb.tls.enabled` has no default (ADR-0845) and "
      "must be `true` or `false`.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.taskDb.tls) }}
{{- fail (printf (join "" (list
      "task: `taskDb.tls` must be a map and is %s (%s). `enabled`, `caSecret`, "
      "`caSecretKey` and `domain` all live under it, so a string, number or "
      "list here cannot be read. Write the block this chart's `values.yaml` "
      "declares."))
      (kindOf .Values.taskDb.tls) (toJson .Values.taskDb.tls)) }}
{{- end }}
{{- if not (hasKey .Values.taskDb.tls "enabled") }}
{{- fail (join "" (list
      "task: `taskDb.tls.enabled` is absent. ADR-0845 gives this knob no "
      "compiled-in default: an absent or nulled value is a choice this chart "
      "cannot make for an adopter. Write `taskDb.tls.enabled: true` to dial "
      "task-db over TLS, or `false` to leave it in cleartext.")) }}
{{- end }}
{{- if not (kindIs "bool" .Values.taskDb.tls.enabled) }}
{{- fail (printf (join "" (list
      "task: `taskDb.tls.enabled` must be true or false and is %s (%s). A "
      "string, number, map or list here is not a toggle: the chart renders "
      "TASK_DB_TLS_ENABLED from it unconditionally, so a quoted or typed value "
      "would be misread rather than refused until the pod either fails to boot "
      "or dials the wrong transport. Write the bare word `true` or `false`."))
      (kindOf .Values.taskDb.tls.enabled) (toJson .Values.taskDb.tls.enabled)) }}
{{- end }}

{{/*
`tls.clientAuth` — REQUIRED WITH NO DEFAULT (B-U5, ADR-0854), and the client CA
it needs.

THE CONTRACT HALF OF K-8. The B-U5E expand (C-SVb) declared the key, accepted
it when present and refused `optional`/`required` as "not enforced yet". The
binary now reads LISTEN_TLS_CLIENT_AUTH through `yadgar-lifecycle`'s
`ServerTls` and refuses its absence, so `templates/deployment.yaml` renders it
UNCONDITIONALLY and this block refuses an absent key, with TLS on or off. The
"not enforced yet" refusal is lifted: `optional` and `required` verify a
caller's certificate against `tls.clientCaSecret`'s bundle.

`chart/values.schema.json` lists `clientAuth` under `tls`'s `required`, so an
ABSENT key is the schema's refusal first (K-3 accepts that pre-emption); the
`hasKey` arm below is what holds where the schema does not run. A NULL survives
`required` — `values.yaml` declares no `clientAuth`, so nothing deletes it on
coalescing — and is refused by the `kindIs "string"` arm, by name.

`kindIs "string"` GUARDS EVERY `eq`/`ne` BELOW, and it has to run FIRST. YAML
1.1 reads a BARE `off` (no quotes) as the boolean `false`, so `eq` against it
is a Go template type error ("incompatible types for comparison") rather than
a clean refusal. The message says so by name: writing `clientAuth: "off"`
quoted is the one-character fix.

TWO MORE REFUSALS, each a boot refusal the binary would otherwise raise in a
crash loop: a verifying mode on a cleartext listener (`tls.enabled: false`),
and a verifying mode with no client CA Secret named. `clientCaSecret: ""`
counts as unnamed — the mount's gate is its truthiness.
*/}}
{{- if and (kindIs "map" .Values.tls) (not (hasKey .Values.tls "clientAuth")) }}
{{- fail (join "" (list
      "task: `tls.clientAuth` is absent. ADR-0854 gives this knob no compiled-in "
      "default: the binary refuses to boot without LISTEN_TLS_CLIENT_AUTH, with "
      "TLS on or off. Write the keys you mean: `tls.clientAuth` has no default "
      "and must be \"off\" (callers present nothing), \"optional\" or "
      "\"required\" (callers' certificates are verified against "
      "`tls.clientCaSecret`).")) }}
{{- end }}
{{- if kindIs "map" .Values.tls }}
{{- if not (kindIs "string" .Values.tls.clientAuth) }}
{{- fail (printf (join "" (list
      "task: `tls.clientAuth` must be a quoted string (\"off\", \"optional\" "
      "or \"required\") and is %s (%s). YAML reads a bare off as false: write "
      "`clientAuth: \"off\"`."))
      (kindOf .Values.tls.clientAuth) (toJson .Values.tls.clientAuth)) }}
{{- end }}
{{- if not (has .Values.tls.clientAuth (list "off" "optional" "required")) }}
{{- fail (printf (join "" (list
      "task: `tls.clientAuth` must be `off`, `optional` or `required` "
      "(ADR-0854) and is %s. The binary refuses any other value at boot."))
      (toJson .Values.tls.clientAuth)) }}
{{- end }}
{{- if and (ne .Values.tls.clientAuth "off") (not .Values.tls.enabled) }}
{{- fail (printf (join "" (list
      "task: `tls.clientAuth: %s` needs `tls.enabled: true`. A cleartext "
      "listener cannot verify a client certificate, and the binary refuses "
      "the pair at boot rather than ignore a security setting. Set "
      "`tls.enabled: true`, or `tls.clientAuth: \"off\"`."))
      .Values.tls.clientAuth) }}
{{- end }}
{{- if and (ne .Values.tls.clientAuth "off") (not .Values.tls.clientCaSecret) }}
{{- fail (printf (join "" (list
      "task: `tls.clientAuth: %s` verifies a caller's certificate, so it needs "
      "the authority to verify it against: name the Secret holding that CA "
      "bundle in `tls.clientCaSecret` (and its key in `tls.clientCaSecretKey`). "
      "Without it the chart renders no LISTEN_TLS_CLIENT_CA_FILE and the "
      "binary refuses to boot."))
      .Values.tls.clientAuth) }}
{{- end }}
{{- end }}
