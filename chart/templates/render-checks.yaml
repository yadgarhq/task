{{/*
EVERY RENDER CHECK THIS CHART DECLARES, IN ONE FILE, AND THE FILE RENDERS NOTHING.

ONE CHECK PER OPERATOR, NOT ONE PER KIND. `autoscaling.enabled` renders one kind
today, so the two counts happen to be equal here — they are not the same rule, and
the number this chart asserts is the number of CHECKS.
`scripts/tests/test_render_checks.py` counts the checks DECLARED here and asserts
that number, so a check deleted from this file reddens the suite on the count rather
than letting it quietly exercise one fewer.

THE FILENAME DOES NOT BEGIN WITH AN UNDERSCORE, AND THAT IS LOAD-BEARING. helm
treats `templates/_*` as partials and never renders them, so a `fail` that lived
only in `_require_api.tpl` would never fire. The definition is a partial; the CALL
has to sit in a rendered template. Do not tidy the two into one file.

THE GROUP IS THE OPERATOR'S OWN. `keda.sh/v1alpha1` is registered by KEDA and by
nothing else, so there is no sibling specification a check could name by mistake —
unlike the Gateway API, which several implementations register. The string is a
LITERAL here because `scripts/tests/test_render_checks.py` reads these arguments off
the template to count and exercise the checks; it is RECORDED a second time in
`values.yaml` under `autoscaling.kedaOperator.apiVersion`, beside the toggle, and the
gate that keeps the two one is
`test_autoscaling.py::test_the_render_check_names_the_group_the_values_file_records`.

THIS CHART DECLARES NO GATEWAY API CHECK, and that absence is a decision rather than
an omission. A render check may only ever sit behind a default-false toggle, and
`gateway.enabled` is the one toggle in this estate that is true by default — a check
behind it would refuse every offline render in the estate. The rule is about the
toggle's DEFAULT, not about the API group.

THE TOGGLE IS OPT-IN, which is what makes this check legal at all: `Has` is false for
every CRD-backed group with no cluster, so a check reachable at the defaults would
refuse every offline render.
*/}}
{{/*
THE SHAPE OF `autoscaling` AND `autoscaling.enabled`, REFUSED BEFORE EITHER TOGGLE READS THEM.

`templates/scaledobject.yaml` and the KEDA check below both gate on
`{{ if .Values.autoscaling.enabled }}` — a BARE TRUTHINESS TEST, which is FAIL-OPEN on a
string. Measured on helm 3.20.2 and 4.3.0, identically: `autoscaling.enabled: "false"` and
`"no"` — which read as OFF to any human — CREATE a ScaledObject.

ADR-0850 (extending ADR-0797) IS THE GOVERNING RULE: a bool toggle a template reads is
validated with `kindIs "bool"` ON THE RAW VALUE, and the reading template carries its own
shape guard rather than relying only on this file. Not `kindIs "map"` on `enabled` itself —
that is ADR-0794's rule for a key whose value is a BLOCK, and `enabled`'s value is a bool.
Never on the result of a `default`: sprig's `default` substitutes on an EMPTY value, so
`false`, `0`, `""` and `[]` all collapse into the default and the kind test then covers
exactly the non-empty scalars.

`autoscaling` ITSELF GETS THE ADR-0794 IDIOM — `hasKey` for presence, `kindIs "map"` for
shape — BECAUSE IT IS READ AT A DOTTED PATH. `.Values.autoscaling.enabled` on a non-map
`autoscaling` does not refuse, it RAISES: measured on helm 4.3.0, a go/template panic
naming the field it failed on, with no chart name and no key name in it (see
`scripts/tests/test_render_checks.py`'s `RAISE_MARKERS` for the exact wording this file
may never quote). `database.create` in the `-db` charts has no sibling guard on
`.Values.database` because nothing else in this file reads a dotted path off it before the
`kindIs "bool"` arm does; `autoscaling.enabled` does, so the guard that stops the panic goes
here, first.

`hasKey` COMES FIRST BECAUSE `kindOf` CANNOT TELL A DELETED KEY FROM AN ABSENT ONE — it
answers `invalid` for both. Helm DELETES a null-valued key when some chart in the tree
declares it, and restores no default: this chart's own `values.yaml` declares both
`autoscaling` and `autoscaling.enabled`, so a values file that OMITS either key gets that
default back and `hasKey` is true for it. `hasKey` is false only when a values file wrote the
key with NO VALUE and helm deleted it.

THE REFUSAL TEXT MAY NOT QUOTE THE RAISE TEXT IT REPLACES (ADR-0794). A refusal and a raise
both exit 1, so the only thing that tells them apart is the message —
`scripts/tests/test_render_checks.py::test_the_shape_refusal_does_not_quote_a_raise` holds
the banned markers and reads this whole file for them.
*/}}
{{- if not (hasKey .Values "autoscaling") }}
{{- fail (join "" (list
      "task: `autoscaling` is absent from the values, so `autoscaling.enabled` cannot be "
      "read. Helm deletes a null-valued key that a chart in the tree declares, and restores "
      "no default, so a values file writing `autoscaling:` with no value leaves this chart "
      "with nothing under it. Write the keys you mean, or omit `autoscaling` entirely and "
      "this chart's own defaults apply.")) }}
{{- end }}
{{- if not (kindIs "map" .Values.autoscaling) }}
{{- fail (printf (join "" (list
      "task: `autoscaling` must be a map and is %s (%s). `autoscaling.enabled` cannot be "
      "read from a non-map value. Write the keys you mean under `autoscaling:`."))
      (kindOf .Values.autoscaling) (toJson .Values.autoscaling)) }}
{{- end }}
{{- if not (kindIs "bool" .Values.autoscaling.enabled) }}
{{- fail (printf (join "" (list
      "task: `autoscaling.enabled` must be true or false and is %s (%s). A string, number, "
      "map or list here is not a toggle: the template gates on bare truthiness, so "
      "\"false\", \"no\", \"true\" and 1 all CREATE a ScaledObject while {}, 0, [] and an "
      "absent key do not, and nothing tells you which one you wrote. Write the bare word "
      "`true` or `false`."))
      (kindOf .Values.autoscaling.enabled) (toJson .Values.autoscaling.enabled)) }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- include "task.require-api" (dict
      "context" $
      "apiVersion" "keda.sh/v1alpha1"
      "operator" "KEDA"
      "toggle" "autoscaling.enabled") }}
{{- end }}
