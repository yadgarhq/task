apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # OMITTED ENTIRELY WHEN KEDA OWNS THE COUNT, and that guard is the whole point
  # of the condition. KEDA drives a ScaledObject through an HPA, which writes
  # `spec.replicas` on this Deployment; Argo runs with `selfHeal: true` and no
  # `ignoreDifferences` for this field, so a rendered `replicas:` is a value Argo
  # keeps restoring and the autoscaler keeps overwriting. That is not a snap on
  # each upgrade — it is a CONTINUOUS revert loop, in which a scale-up is undone
  # within a sync interval and the load that caused it is served by
  # `replicaCount` pods.
  #
  # Rendering nothing hands the field to the HPA, which is what `minReplicas`
  # exists to floor. `replicaCount` still applies to every deployment that has
  # not enabled autoscaling, which is the chart's own default (D80).
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        # OPT-IN scraping. Prometheus discovers pods by this annotation rather
        # than from a static list, so a new module is scraped by declaring itself
        # rather than by someone remembering to add it centrally (D62's shape).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # NO SERVICE ACCOUNT TOKEN IN THIS POD. This binary calls no Kubernetes
      # API: it serves gRPC, dials `task-db`, and reads its configuration from
      # environment variables and mounted files. Without this line kubelet
      # projects a token for the default ServiceAccount into every container, so
      # anything that achieves code execution here starts with a credential for
      # the API server that nothing was ever meant to use.
      #
      # Set to `false` rather than left out: the field DEFAULTS to true, so
      # absence is the permissive answer.
      automountServiceAccountToken: false
      # POD-level, and distinct from the container block below. Setting only the
      # container context leaves the pod admitting root — runAsNonRoot is the
      # assertion that actually refuses an image which would run as one, rather
      # than trusting the Containerfile to have said so.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          # A published chart carries image.digest and no tag (D65, D61).
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          # EXPLICIT, because the implicit default flips with the tag form and
          # this chart uses both. In git the image is a moving tag (D65), and a
          # moving tag with IfNotPresent means a node serves whatever it cached
          # first — forever, silently, while the deployment looks current.
          #
          # Kubernetes defaults to Always only when the tag is literally `latest`,
          # so the published chart's digest form defaults to IfNotPresent — and a
          # Deployment created from one and later pointed at the other keeps the
          # old policy. That is how a cluster ends up running a build nobody
          # shipped, which is exactly what happened here.
          #
          # Always is correct for both forms: a digest that is already present is
          # not re-downloaded, so this costs nothing where the digest is pinned.
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 50052
          env:
            - name: TASK_DB_HOST
              value: {{ .Values.taskDb.host | quote }}
            - name: TASK_DB_PORT
              value: {{ .Values.taskDb.port | quote }}
            {{- if .Values.taskDb.tls.enabled }}
            # RENDERED ONLY WHEN TLS IS ASKED FOR, so a deployment that has not
            # cut over sends the binary nothing at all and takes the cleartext
            # path it always took. The same shape as the gateway's
            # trustUnauthenticatedHeaders: absence is the default, and the flag
            # is the whole of the lever.
            - name: TASK_DB_TLS_ENABLED
              value: "1"
            # A PATH, never an issuer-specific resource (D80). cert-manager
            # writes this file in the reference deployment and a hand-assembled
            # Secret writes it anywhere else; neither the chart nor the binary
            # can tell the difference, which is the point.
            - name: TASK_DB_TLS_CA_FILE
              value: /var/run/config/task-db-ca/ca.pem
            {{- if .Values.taskDb.tls.domain }}
            # Only when the certificate names something other than the Service.
            # Unset means "verify against taskDb.host", which is what makes a
            # certificate issued for the Service name work while the balancer
            # dials pod addresses.
            - name: TASK_DB_TLS_DOMAIN
              value: {{ .Values.taskDb.tls.domain | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            # THE OTHER DIRECTION: what a caller reaching THIS service gets.
            # Rendered only when asked for, so a deployment that has not cut over
            # sends the binary nothing and opens the cleartext listener it has
            # always opened.
            - name: LISTEN_TLS_ENABLED
              value: "1"
            # PATHS, never an issuer-specific resource (D80). Two of them,
            # because a certificate and its key are two files — and naming them
            # separately is what lets the binary say WHICH of the two was missing
            # when only half of a Secret mounted.
            - name: LISTEN_TLS_CERT_FILE
              value: /var/run/config/serving-cert/tls.crt
            - name: LISTEN_TLS_KEY_FILE
              value: /var/run/config/serving-cert/tls.key
            {{- end }}
          # This service does NOT wait for task-db before listening, so the port
          # opening means "process up", not "dependency healthy" — deliberately.
          # Blocking startup on a -db that is still migrating would turn one
          # module's slow boot into a cascading outage, and a pod stuck in
          # startup is one D68's autoscaler cannot help. A request that cannot
          # reach the store fails with UNAVAILABLE, which is recoverable.
          #
          # A tcpSocket probe is still the right one once tls.enabled is set: it
          # completes a TCP connection and no handshake, so it neither needs a
          # certificate of its own nor cares which transport the port speaks.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- if or .Values.taskDb.tls.enabled .Values.tls.enabled }}
          volumeMounts:
            {{- if .Values.taskDb.tls.enabled }}
            # A DIRECTORY MOUNT, never subPath. A subPath mount is a one-time
            # copy that kubelet never refreshes, so the bundle would freeze at
            # whatever it was when the pod started and a rotated authority would
            # never reach this process.
            - name: task-db-ca
              mountPath: /var/run/config/task-db-ca
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            # A DIRECTORY MOUNT for the same reason, and here it matters more: a
            # frozen serving certificate EXPIRES, and every caller starts
            # refusing this pod on a date nobody is watching.
            - name: serving-cert
              mountPath: /var/run/config/serving-cert
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.taskDb.tls.enabled .Values.tls.enabled }}
      volumes:
        {{- if .Values.taskDb.tls.enabled }}
        - name: task-db-ca
          secret:
            secretName: {{ required "taskDb.tls.caSecret holds the CA bundle task-db is verified against and must be set whenever taskDb.tls.enabled is; see the chart's values.yaml" .Values.taskDb.tls.caSecret }}
            # OPTIONAL, and that is not laxity — it is which error the operator
            # gets. A required mount that cannot be satisfied leaves the pod in
            # ContainerCreating with a FailedMount event about a volume. An
            # optional one mounts an empty directory, the binary finds no file
            # at TASK_DB_TLS_CA_FILE, and it exits at boot naming THAT PATH and
            # saying that TLS was asked for so cleartext is not the answer.
            # Neither starts; only one of them explains itself. There is no
            # third outcome in which this pod serves traffic over an
            # unencrypted connection it was told to encrypt.
            optional: true
            # ONE KEY, not the whole Secret. The Secret this usually names also
            # holds a PRIVATE KEY, and this pod has no business being able to
            # read it. Selecting a single key is what keeps it out, and it is
            # also what renames whatever the issuer called it to the `ca.pem`
            # that TASK_DB_TLS_CA_FILE names.
            items:
              - key: {{ required "taskDb.tls.caSecretKey names the key inside taskDb.tls.caSecret that holds the CA bundle and must be set whenever taskDb.tls.enabled is; see the chart's values.yaml" .Values.taskDb.tls.caSecretKey | quote }}
                path: ca.pem
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: serving-cert
          secret:
            secretName: {{ required "tls.certSecret holds the certificate and private key this service presents and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.certSecret }}
            # OPTIONAL, for the same reason as above: it decides WHICH error the
            # operator gets. A required mount that cannot be satisfied leaves the
            # pod in ContainerCreating with a FailedMount event about a volume.
            # An optional one mounts an empty directory, the binary finds no file
            # at LISTEN_TLS_CERT_FILE, and it exits at boot naming THAT PATH and
            # saying that TLS was asked for so a plaintext listener is not the
            # answer. Neither starts; only one of them explains itself.
            optional: true
            # NAMED KEYS rather than the whole Secret. An issuer's Secret also
            # carries `ca.crt`, which this pod has no use for, and selecting the
            # two it does need is what renames whatever the issuer called them to
            # the `tls.crt` and `tls.key` that LISTEN_TLS_CERT_FILE and
            # LISTEN_TLS_KEY_FILE name.
            items:
              - key: {{ required "tls.certSecretKey names the key inside tls.certSecret that holds the certificate and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.certSecretKey | quote }}
                path: tls.crt
              - key: {{ required "tls.keySecretKey names the key inside tls.certSecret that holds the private key and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.keySecretKey | quote }}
                path: tls.key
        {{- end }}
      {{- end }}
