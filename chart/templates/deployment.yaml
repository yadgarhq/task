apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # OMITTED ENTIRELY WHEN KEDA OWNS THE COUNT, and that guard is the whole point
  # of the condition. KEDA drives a ScaledObject through an HPA, which writes
  # `spec.replicas` on this Deployment; Argo runs with `selfHeal: true` and no
  # `ignoreDifferences` for this field, so a rendered `replicas:` is a value Argo
  # keeps restoring and the autoscaler keeps overwriting. That is not a snap on
  # each upgrade — it is a CONTINUOUS revert loop, in which a scale-up is undone
  # within a sync interval and the load that caused it is served by
  # `replicaCount` pods.
  #
  # Rendering nothing hands the field to the HPA, which is what `minReplicas`
  # exists to floor. `replicaCount` still applies to every deployment that has
  # not enabled autoscaling, which is the chart's own default (D80).
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
      annotations:
        # OPT-IN scraping. Prometheus discovers pods by this annotation rather
        # than from a static list, so a new module is scraped by declaring itself
        # rather than by someone remembering to add it centrally (D62's shape).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # NO SERVICE ACCOUNT TOKEN IN THIS POD. This binary calls no Kubernetes
      # API: it serves gRPC, dials `task-db`, and reads its configuration from
      # environment variables and mounted files. Without this line kubelet
      # projects a token for the default ServiceAccount into every container, so
      # anything that achieves code execution here starts with a credential for
      # the API server that nothing was ever meant to use.
      #
      # Set to `false` rather than left out: the field DEFAULTS to true, so
      # absence is the permissive answer.
      automountServiceAccountToken: false
      # POD-level, and distinct from the container block below. Setting only the
      # container context leaves the pod admitting root — runAsNonRoot is the
      # assertion that actually refuses an image which would run as one, rather
      # than trusting the Containerfile to have said so.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          # A published chart carries image.digest and no tag (D65, D61).
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          # EXPLICIT, because the implicit default flips with the tag form and
          # this chart uses both. In git the image is a moving tag (D65), and a
          # moving tag with IfNotPresent means a node serves whatever it cached
          # first — forever, silently, while the deployment looks current.
          #
          # Kubernetes defaults to Always only when the tag is literally `latest`,
          # so the published chart's digest form defaults to IfNotPresent — and a
          # Deployment created from one and later pointed at the other keeps the
          # old policy. That is how a cluster ends up running a build nobody
          # shipped, which is exactly what happened here.
          #
          # Always is correct for both forms: a digest that is already present is
          # not re-downloaded, so this costs nothing where the digest is pinned.
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 50052
          env:
            - name: TASK_DB_HOST
              value: {{ .Values.taskDb.host | quote }}
            - name: TASK_DB_PORT
              value: {{ .Values.taskDb.port | quote }}
            {{- if .Values.taskDb.tls.enabled }}
            # RENDERED ONLY WHEN TLS IS ASKED FOR, so a deployment that has not
            # cut over sends the binary nothing at all and takes the cleartext
            # path it always took. The same shape as the gateway's
            # trustUnauthenticatedHeaders: absence is the default, and the flag
            # is the whole of the lever.
            - name: TASK_DB_TLS_ENABLED
              value: "1"
            # A PATH, never an issuer-specific resource (D80). cert-manager
            # writes this file in the reference deployment and a hand-assembled
            # Secret writes it anywhere else; neither the chart nor the binary
            # can tell the difference, which is the point.
            - name: TASK_DB_TLS_CA_FILE
              value: /var/run/config/task-db-ca/ca.pem
            {{- if .Values.taskDb.tls.clientCertSecret }}
            # WHO THIS SERVICE SAYS IT IS ON THAT HOP — mutual TLS (ADR-0516),
            # and a THIRD direction beside the two others in this file.
            # LISTEN_TLS_* is what task serves; TASK_DB_TLS_CA_FILE is how task
            # verifies task-db; these two are what task PRESENTS so task-db can
            # authenticate the caller.
            #
            # RENDERED ONLY WHEN A SECRET IS NAMED, and
            # `taskDb.tls.clientCertSecret` is EMPTY by default. So turning
            # `taskDb.tls.enabled` on encrypts the hop and presents no identity,
            # exactly as before; naming the Secret is a second, separately
            # revertible lever. The binary refuses one path without the other, so
            # the two are rendered together or not at all.
            #
            # PATHS, never an issuer-specific resource (D80), for the reason
            # given on TASK_DB_TLS_CA_FILE above.
            - name: TASK_DB_TLS_CLIENT_CERT_FILE
              value: /var/run/secrets/client-cert/client.crt
            - name: TASK_DB_TLS_CLIENT_KEY_FILE
              value: /var/run/secrets/client-cert/client.key
            {{- end }}
            {{- if .Values.taskDb.tls.domain }}
            # Only when the certificate names something other than the Service.
            # Unset means "verify against taskDb.host", which is what makes a
            # certificate issued for the Service name work while the balancer
            # dials pod addresses.
            - name: TASK_DB_TLS_DOMAIN
              value: {{ .Values.taskDb.tls.domain | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            # THE OTHER DIRECTION: what a caller reaching THIS service gets.
            # Rendered only when asked for, so a deployment that has not cut over
            # sends the binary nothing and opens the cleartext listener it has
            # always opened.
            - name: LISTEN_TLS_ENABLED
              value: "1"
            # PATHS, never an issuer-specific resource (D80). Two of them,
            # because a certificate and its key are two files — and naming them
            # separately is what lets the binary say WHICH of the two was missing
            # when only half of a Secret mounted.
            - name: LISTEN_TLS_CERT_FILE
              value: /var/run/config/serving-cert/tls.crt
            - name: LISTEN_TLS_KEY_FILE
              value: /var/run/config/serving-cert/tls.key
            {{- end }}
            # HOW OFTEN THE TLS FILES ABOVE ARE RE-HASHED, and how long this pod
            # waits before acting on a change (ADR-0523).
            #
            # tonic cannot swap a running listener's certificate and nothing
            # re-reads a dialled channel's client identity, so task re-reads
            # nothing: it notices the files changed, drains, and exits 0, and
            # kubelet restarts the container onto the new material. The Secrets
            # are mounted as DIRECTORIES below, never with subPath, which is what
            # makes kubelet refresh them inside the pod at all.
            #
            # THE CLIENT CERTIFICATE IS THE MEMBER WITH THE WORST FAILURE: an
            # expired client leaf STOPS the hop to task-db rather than degrading
            # it, so a process that never re-reads works until the expiry date
            # and then cannot reach its own store.
            #
            # THE SPLAY IS THE ONLY THING SEPARATING THE TWO REPLICAS. Both see
            # the refreshed file inside the same kubelet sync window, and the
            # PodDisruptionBudget does NOT govern a self-exit — it constrains
            # eviction, and nothing here is evicting anything. Renewal lands 30
            # days before expiry, so five minutes of waiting costs nothing.
            #
            # RENDERED WHETHER OR NOT ANY TLS IS ON, and parsed at boot either
            # way. Unlike iam, this service watches nothing on a cleartext
            # install — the transport is the only security material it reads — so
            # the watcher simply idles. A value an operator set and the binary
            # cannot use is still an error, which is the point of parsing it
            # regardless.
            #
            # TWO CHECKS, AND NEITHER COVERS THE OTHER. `required` catches a
            # values override that nulls the block AND one that empties it, and
            # turns either into a template-time error naming the value rather
            # than a CrashLoop three layers from its message. What reaches the
            # binary is a value that is present and non-empty: a non-integer, or
            # `0`. `rotate::Schedule::from_lookup` refuses both, and `0` by name,
            # because sleeping for no time at all is a hot loop rather than a way
            # of turning the watcher off.
            #
            # NOT `| default`, which would hand back an interval nobody chose and
            # leave an operator who believes they changed it running the old one.
            - name: TLS_ROTATION_POLL_SECS
              value: {{ required "tlsRotation.pollSeconds is how often task re-hashes the TLS files it read at boot and must be set; see the chart's values.yaml" .Values.tlsRotation.pollSeconds | quote }}
            - name: TLS_ROTATION_SPLAY_MAX_SECS
              value: {{ required "tlsRotation.splayMaxSeconds is the longest a pod waits before exiting on a rotated certificate and must be set; see the chart's values.yaml" .Values.tlsRotation.splayMaxSeconds | quote }}
          # This service does NOT wait for task-db before listening, so the port
          # opening means "process up", not "dependency healthy" — deliberately.
          # Blocking startup on a -db that is still migrating would turn one
          # module's slow boot into a cascading outage, and a pod stuck in
          # startup is one D68's autoscaler cannot help. A request that cannot
          # reach the store fails with UNAVAILABLE, which is recoverable.
          #
          # A tcpSocket probe is still the right one once tls.enabled is set: it
          # completes a TCP connection and no handshake, so it neither needs a
          # certificate of its own nor cares which transport the port speaks.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # THE CONFIGURATION REPOSITORY'S TWO CONFIGMAPS (ADR-0569, ADR-0570,
            # step 2a): the knobs every service reads, and this service's own —
            # empty today, mounted anyway so it is ready the day it is not.
            #
            # DIRECTORIES, NEVER `subPath`. A subPath mount is copied once at
            # container start and kubelet never updates it, so the file would be
            # frozen for the life of the pod while the ConfigMap moved underneath
            # it — the rotation watcher would see nothing and an edited knob
            # would silently never take effect.
            #
            # NO `optional: true`, unlike every Secret mount below. The default,
            # `false`, is what makes kubelet refuse to start this pod at all
            # while `shared` or `task` is absent — `ContainerCreating` naming
            # the missing ConfigMap — rather than starting it with an empty
            # directory the binary would then refuse to read from anyway
            # (`ScheduleError::Absent`).
            #
            # **`task` IS MOUNTED, AND TODAY IT IS NEITHER READ NOR WATCHED.**
            # `yadgar-lifecycle`'s `Configuration::under(root)` yields exactly one
            # path, `root/shared/shared.yaml`; the crate has no API for a
            # per-service document, so `config-task` is in no process's
            # ADR-0523 watch set. Two things follow and both are deliberate. The
            # `optional: false` reasoning above is true of `shared` and NOT of
            # this one — an absent `task` ConfigMap blocks the pod for no
            # functional benefit, which is accepted so that both mounts are
            # governed by one rule rather than two. And the day this file gains
            # its first knob, Argo will sync it and kubelet will swap it and NO
            # POD WILL RESTART, so the new value never takes effect and nothing
            # reports that — the exact failure ADR-0570 names for `envFrom`,
            # reproduced through a file mount. THE MOUNT IS READY; JOINING THIS
            # DOCUMENT TO THE WATCH SET IS A FURTHER CHANGE, and it belongs in
            # the same pull request as the first task-only knob.
            - name: config-shared
              mountPath: /etc/yadgar/config/shared
              readOnly: true
            - name: config-task
              mountPath: /etc/yadgar/config/task
              readOnly: true
            {{- if .Values.taskDb.tls.enabled }}
            # A DIRECTORY MOUNT, never subPath. A subPath mount is a one-time
            # copy that kubelet never refreshes, so the bundle would freeze at
            # whatever it was when the pod started and a rotated authority would
            # never reach this process.
            - name: task-db-ca
              mountPath: /var/run/config/task-db-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.taskDb.tls.enabled .Values.taskDb.tls.clientCertSecret }}
            # A DIRECTORY MOUNT, never subPath — and here the rule is at its most
            # expensive to break. A subPath mount is a one-time copy kubelet
            # never refreshes, so a renewed CLIENT certificate would never reach
            # this process; ADR-0516 makes that an expired leaf that STOPS the
            # hop to task-db rather than one that merely weakens it. The rotation
            # watcher only works because this is a directory.
            - name: client-cert
              mountPath: /var/run/secrets/client-cert
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            # A DIRECTORY MOUNT for the same reason, and here it matters more: a
            # frozen serving certificate EXPIRES, and every caller starts
            # refusing this pod on a date nobody is watching.
            - name: serving-cert
              mountPath: /var/run/config/serving-cert
              readOnly: true
            {{- end }}
      volumes:
        # The two ConfigMaps `yadgarhq/config` renders, same reasoning as the
        # mounts above: unconditional, a directory each, never optional.
        - name: config-shared
          configMap:
            name: shared
        - name: config-task
          configMap:
            name: task
        {{- if .Values.taskDb.tls.enabled }}
        - name: task-db-ca
          secret:
            secretName: {{ required "taskDb.tls.caSecret holds the CA bundle task-db is verified against and must be set whenever taskDb.tls.enabled is; see the chart's values.yaml" .Values.taskDb.tls.caSecret }}
            # OPTIONAL, and that is not laxity — it is which error the operator
            # gets. A required mount that cannot be satisfied leaves the pod in
            # ContainerCreating with a FailedMount event about a volume. An
            # optional one mounts an empty directory, the binary finds no file
            # at TASK_DB_TLS_CA_FILE, and it exits at boot naming THAT PATH and
            # saying that TLS was asked for so cleartext is not the answer.
            # Neither starts; only one of them explains itself. There is no
            # third outcome in which this pod serves traffic over an
            # unencrypted connection it was told to encrypt.
            optional: true
            # ONE KEY, not the whole Secret. The Secret this usually names also
            # holds a PRIVATE KEY, and this pod has no business being able to
            # read it. Selecting a single key is what keeps it out, and it is
            # also what renames whatever the issuer called it to the `ca.pem`
            # that TASK_DB_TLS_CA_FILE names.
            items:
              - key: {{ required "taskDb.tls.caSecretKey names the key inside taskDb.tls.caSecret that holds the CA bundle and must be set whenever taskDb.tls.enabled is; see the chart's values.yaml" .Values.taskDb.tls.caSecretKey | quote }}
                path: ca.pem
        {{- end }}
        {{- if and .Values.taskDb.tls.enabled .Values.taskDb.tls.clientCertSecret }}
        - name: client-cert
          secret:
            secretName: {{ .Values.taskDb.tls.clientCertSecret }}
            # OPTIONAL, and it means the same thing it means on the CA above: the
            # process MUST NOT START without a usable identity once one has been
            # asked for, and optional is simply which error says so. A required
            # mount that cannot be satisfied leaves the pod in ContainerCreating
            # with a FailedMount event about a volume; an optional one mounts an
            # empty directory, the binary finds no file at
            # TASK_DB_TLS_CLIENT_CERT_FILE, and `yadgar_dial::connect_tls`
            # refuses naming THAT PATH. Neither starts; only one explains itself.
            # There is no third outcome in which this pod dials task-db without
            # the identity it was told to present.
            optional: true
            # BOTH KEYS, because a certificate cannot be presented without the
            # key that proves it. This is this pod's OWN key, which is what makes
            # it different from the CA mount above — that one selects a single
            # key precisely to keep task-db's private key out of this pod.
            items:
              - key: {{ required "taskDb.tls.clientCertSecretKey names the key inside taskDb.tls.clientCertSecret that holds the client certificate and must be set whenever taskDb.tls.clientCertSecret is; see the chart's values.yaml" .Values.taskDb.tls.clientCertSecretKey | quote }}
                path: client.crt
              - key: {{ required "taskDb.tls.clientKeySecretKey names the key inside taskDb.tls.clientCertSecret that holds the client private key and must be set whenever taskDb.tls.clientCertSecret is; see the chart's values.yaml" .Values.taskDb.tls.clientKeySecretKey | quote }}
                path: client.key
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: serving-cert
          secret:
            secretName: {{ required "tls.certSecret holds the certificate and private key this service presents and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.certSecret }}
            # OPTIONAL, for the same reason as above: it decides WHICH error the
            # operator gets. A required mount that cannot be satisfied leaves the
            # pod in ContainerCreating with a FailedMount event about a volume.
            # An optional one mounts an empty directory, the binary finds no file
            # at LISTEN_TLS_CERT_FILE, and it exits at boot naming THAT PATH and
            # saying that TLS was asked for so a plaintext listener is not the
            # answer. Neither starts; only one of them explains itself.
            optional: true
            # NAMED KEYS rather than the whole Secret. An issuer's Secret also
            # carries `ca.crt`, which this pod has no use for, and selecting the
            # two it does need is what renames whatever the issuer called them to
            # the `tls.crt` and `tls.key` that LISTEN_TLS_CERT_FILE and
            # LISTEN_TLS_KEY_FILE name.
            items:
              - key: {{ required "tls.certSecretKey names the key inside tls.certSecret that holds the certificate and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.certSecretKey | quote }}
                path: tls.crt
              - key: {{ required "tls.keySecretKey names the key inside tls.certSecret that holds the private key and must be set whenever tls.enabled is; see the chart's values.yaml" .Values.tls.keySecretKey | quote }}
                path: tls.key
        {{- end }}
